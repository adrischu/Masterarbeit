name: Prüfung

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run type-check
      - name: Tests
        run: npm run test:unit -- --run
      - name: Build
        run: npm run build-only
